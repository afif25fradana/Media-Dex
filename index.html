<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PERSONAL DEX — My Media Collection</title>
  <meta name="description" content="A Persona 5-inspired showcase of personal taste in music, movies, TV, and games.">
  <meta property="og:title" content="PERSONAL DEX — My Media Collection">
  <meta property="og:description" content="A Persona 5-inspired showcase of personal taste in music, movies, TV, and games.">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="PERSONAL DEX — My Media Collection">
  <meta name="twitter:description" content="A Persona 5-inspired showcase of personal taste in music, movies, TV, and games.">
  <meta name="theme-color" content="#F0ECE2">

  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Caveat:wght@400;700&family=JetBrains+Mono:wght@400;500;700&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="src/style.css">
</head>
<body>
  <a href="#app" class="skip-link">Skip to content</a>

  <!-- LOADING SCREEN -->
  <div id="loading-screen" class="loading-screen" role="status">
    <div class="loading-inner">
      <span class="loading-text">LOADING</span>
      <span class="loading-dots">...</span>
    </div>
  </div>

  <noscript>
    <div style="position: fixed; inset: 0; z-index: 10000; background: #0C0C0C; color: #F0ECE2; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.75rem; padding: 2rem; text-align: center; font-family: 'Segoe UI', Arial, sans-serif;">
      <span style="font-family: 'Anton', Impact, sans-serif; font-size: clamp(1.8rem, 4vw, 2.8rem); letter-spacing: 0.05em; text-transform: uppercase; color: #FF3333;">System Error</span>
      <span style="font-size: 0.95rem; max-width: 36ch; line-height: 1.6;">This dex is rendered in your browser, so it needs JavaScript to display the collection. Please enable JavaScript and reload.</span>
    </div>
  </noscript>

  <script>
    // Boot watchdog: if the module graph never finishes loading (blocked script,
    // broken module, partial outage), replace the LOADING screen with a recovery
    // message instead of leaving a permanent black screen.
    window.addEventListener('DOMContentLoaded', function () {
      setTimeout(function () {
        if (window.__dexBooted) return;
        var loader = document.getElementById('loading-screen');
        if (!loader) return;
        loader.innerHTML =
          '<div class="loading-error">' +
            '<h2 class="loading-error-title">System Error</h2>' +
            '<p class="loading-error-msg">The dex could not be loaded. Check your connection and try again.</p>' +
            '<button class="error-retry" onclick="window.location.reload()">RETRY CONNECTION</button>' +
          '</div>';
      }, 8000);
    });
  </script>

  <!-- STICKY NAVBAR -->
  <header class="site-header">
    <nav id="site-navbar" class="site-navbar" aria-label="Main navigation">
      <!-- Rendered by JS -->
    </nav>
  </header>

  <!-- MOBILE MENU OVERLAY -->
  <div id="mobile-menu" class="mobile-menu" aria-hidden="true" inert role="dialog" aria-label="Mobile navigation menu">
    <!-- Rendered by JS -->
  </div>

  <!-- MAIN APP -->
  <main id="app" class="app" aria-label="Personal Media Dex">

    <!-- HERO SECTION -->
    <section id="hero-section" class="hero-section" aria-label="Welcome hero">
      <!-- Rendered by JS -->
    </section>

    <!-- EXPLORE CATEGORIES OVERVIEW -->
    <section id="explore-categories" class="explore-section" aria-label="Explore categories">
      <!-- Rendered by JS -->
    </section>

    <!-- FULL CATEGORY DETAIL SECTIONS -->
    <div id="categories-container">
      <!-- Rendered by JS -->
    </div>

    <!-- RECENTLY ADDED + DEX OVERVIEW -->
    <section id="recent-overview" class="recent-overview-section" aria-label="Recent entries and statistics">
      <!-- Rendered by JS -->
    </section>

    <!-- FOOTER -->
    <footer id="site-footer" class="site-footer">
      <!-- Rendered by JS -->
    </footer>

  </main>
  <script type="module" src="src/script.js"></script>
</body>
</html>
